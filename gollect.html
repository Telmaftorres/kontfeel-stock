<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gollect — K-Stock</title>
  <meta name="theme-color" content="#14532d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #14532d; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    #camera-wrap { flex: 1; position: relative; overflow: hidden; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #canvas { display: none; }

    .scan-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .scan-frame { width: 220px; height: 220px; position: relative; }
    .scan-frame::before, .scan-frame::after, .scan-corner-br, .scan-corner-bl { content: ''; position: absolute; width: 36px; height: 36px; border-color: #4ade80; border-style: solid; }
    .scan-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scan-frame::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scan-corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
    .scan-corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scan-line { position: absolute; left: 4px; right: 4px; height: 2px; background: linear-gradient(90deg, transparent, #4ade80, white, #4ade80, transparent); animation: scan 2s ease-in-out infinite; border-radius: 2px; }
    @keyframes scan { 0% { top: 8px; } 50% { top: calc(100% - 8px); } 100% { top: 8px; } }
    .scan-hint { margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.7); text-align: center; }

    .top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); z-index: 10; pointer-events: all; }
    .top-logo { font-size: 15px; font-weight: 700; color: #4ade80; }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn { width: 38px; height: 38px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; backdrop-filter: blur(4px); font-size: 16px; }

    /* Panel résultat scan */
    #panel { position: absolute; bottom: 0; left: 0; right: 0; background: white; border-radius: 24px 24px 0 0; padding: 20px 20px 36px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); z-index: 20; color: #0f172a; }
    #panel.open { transform: translateY(0); }
    .panel-handle { width: 36px; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 0 auto 16px; }

    .etat-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    .etat-comme_neuf    { background: #dcfce7; color: #15803d; }
    .etat-tres_bon_etat { background: #d1fae5; color: #047857; }
    .etat-bon_etat      { background: #fef9c3; color: #a16207; }
    .etat-mauvais_etat  { background: #fee2e2; color: #b91c1c; }

    .panel-name { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 2px; }
    .panel-desc { font-size: 13px; color: #64748b; margin-bottom: 12px; line-height: 1.4; }

    /* Photos */
    .photos-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
    .photo-thumb { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0; border: 2px solid #e2e8f0; cursor: pointer; }
    .photo-add { width: 72px; height: 72px; border-radius: 10px; border: 2px dashed #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: #94a3b8; cursor: pointer; flex-shrink: 0; background: #f8fafc; }
    .photo-add-icon { font-size: 22px; }

    .stock-row { display: flex; align-items: center; justify-content: space-between; background: #f0fdf4; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
    .stock-label { font-size: 13px; color: #15803d; }
    .stock-val { font-size: 28px; font-weight: 900; color: #14532d; }

    .qty-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 16px; }
    .qty-btn { width: 48px; height: 48px; border: 2px solid #e2e8f0; border-radius: 50%; background: white; font-size: 24px; font-weight: 300; color: #334155; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
    .qty-btn:active { transform: scale(0.88); }
    .qty-val { font-size: 36px; font-weight: 800; min-width: 56px; text-align: center; color: #0f172a; }

    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .btn-action { height: 68px; border: none; border-radius: 14px; font-size: 18px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform 0.1s; }
    .btn-action:active { transform: scale(0.95); }
    .btn-action sub { font-size: 11px; font-weight: 500; opacity: 0.8; }
    .btn-sortie { background: #dc2626; color: white; }
    .btn-entree { background: #16a34a; color: white; }

    .employee-row { display: flex; align-items: center; gap: 8px; }
    .employee-row label { font-size: 13px; color: #64748b; white-space: nowrap; }
    .employee-input { flex: 1; height: 38px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0 12px; font-size: 14px; outline: none; background: #f8fafc; }

    /* Lightbox photo */
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 12px; object-fit: contain; }
    #lightbox-close { position: absolute; top: 20px; right: 20px; font-size: 28px; color: white; cursor: pointer; background: none; border: none; }

    /* Perm screen */
    #perm-screen { position: absolute; inset: 0; background: #14532d; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; z-index: 50; }
    .perm-icon { font-size: 56px; margin-bottom: 16px; }
    .perm-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .perm-sub { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 28px; }
    .perm-btn { background: #16a34a; color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }

    #loading-article { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 15; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #4ade80; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .flash { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 999; white-space: nowrap; }
    .flash.success { background: #16a34a; color: white; opacity: 1; }
    .flash.error   { background: #dc2626; color: white; opacity: 1; }
    .flash.hide    { opacity: 0; }

    /* FAB + */
    .fab { position: fixed; bottom: 32px; right: 24px; width: 60px; height: 60px; background: #16a34a; border: none; border-radius: 50%; color: white; font-size: 32px; font-weight: 300; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(22,163,74,0.5); cursor: pointer; z-index: 30; transition: transform 0.15s; }
    .fab:active { transform: scale(0.92); }

    /* Modal ajout */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: white; color: #0f172a; border-radius: 24px 24px 0 0; padding: 20px 20px 40px; width: 100%; max-width: 640px; }
    .modal-handle { width: 36px; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 0 auto 16px; }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; color: #14532d; }
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 4px; display: block; }
    .form-input, .form-select { width: 100%; height: 44px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0 12px; font-size: 15px; background: #f8fafc; outline: none; }
    .form-input:focus, .form-select:focus { border-color: #16a34a; background: white; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btn { flex: 1; height: 50px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .modal-btn-cancel { background: #f1f5f9; color: #475569; }
    .modal-btn-save { background: #16a34a; color: white; }

    /* Photo preview in modal */
    .photo-preview-wrap { position: relative; width: 100%; height: 160px; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; margin-bottom: 12px; background: #f8fafc; }
    .photo-preview-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .photo-placeholder { text-align: center; color: #94a3b8; pointer-events: none; }
    .photo-placeholder div { font-size: 32px; margin-bottom: 4px; }
    .photo-placeholder p { font-size: 13px; }
  </style>
</head>
<body>

<div id="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="perm-screen">
    <div class="perm-icon">♻️</div>
    <div class="perm-title">Gollect</div>
    <div class="perm-sub">Accès caméra requis pour scanner les articles.</div>
    <button class="perm-btn" onclick="startCamera()">Autoriser la caméra</button>
  </div>

  <div id="loading-article"><div class="spinner"></div></div>

  <div class="top-bar">
    <span class="top-logo">♻️ Gollect</span>
    <div class="top-actions">
      <a class="icon-btn" href="index.html" title="Stock">🏠</a>
      <a class="icon-btn" href="gollect-list.html" title="Liste">☰</a>
    </div>
  </div>

  <div class="scan-overlay" id="scan-overlay">
    <div class="scan-frame">
      <div class="scan-corner-br"></div>
      <div class="scan-corner-bl"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-hint">Scanne un article Gollect</div>
  </div>

  <!-- Panel résultat -->
  <div id="panel">
    <div class="panel-handle"></div>
    <div id="p-etat-badge"></div>
    <div class="panel-name" id="p-name"></div>
    <div class="panel-desc" id="p-desc"></div>

    <div class="photos-row" id="p-photos">
      <label class="photo-add" style="cursor:pointer;">
        <span class="photo-add-icon">📷</span>
        <span>Photo</span>
        <input type="file" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(this)" />
      </label>
    </div>

    <div class="stock-row">
      <span class="stock-label">En stock</span>
      <span class="stock-val" id="p-stock">—</span>
    </div>

    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <div class="qty-val" id="qty-display">1</div>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>

    <div class="action-row">
      <button class="btn-action btn-sortie" onclick="doAction('sortie')">↓ SORTIE<br><sub>retirer</sub></button>
      <button class="btn-action btn-entree" onclick="doAction('entree')">↑ ENTRÉE<br><sub>ajouter</sub></button>
    </div>

    <div class="employee-row">
      <label>Qui ?</label>
      <input type="text" class="employee-input" id="employee-input" placeholder="Ton prénom…" />
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" />
</div>

<!-- FAB -->
<button class="fab" onclick="openModal()">+</button>

<!-- Modal ajout -->
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">♻️ Nouvel article Gollect</div>

    <div class="form-group">
      <label class="form-label">Nom *</label>
      <input type="text" class="form-input" id="m-nom" placeholder="ex: Kakémono Stand X, Présentoir…" />
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <input type="text" class="form-input" id="m-desc" placeholder="Dimensions, matière, détails…" />
    </div>
    <div class="form-group">
      <label class="form-label">État</label>
      <select class="form-select" id="m-etat">
        <option value="comme_neuf">⭐ Comme neuf</option>
        <option value="tres_bon_etat">✅ Très bon état</option>
        <option value="bon_etat" selected>👍 Bon état</option>
        <option value="mauvais_etat">⚠️ Mauvais état</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Quantité initiale</label>
      <input type="number" class="form-input" id="m-stock" value="1" min="1" />
    </div>

    <label class="photo-preview-wrap" id="photo-preview-wrap">
      <div class="photo-placeholder" id="photo-placeholder">
        <div>📷</div>
        <p>Prendre une photo (optionnel)</p>
      </div>
      <input type="file" accept="image/*" capture="environment" style="display:none" id="m-photo-input" onchange="previewPhoto(this)" />
    </label>

    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-btn modal-btn-save" id="modal-save-btn" onclick="saveItem()">Créer</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const ETAT_LABELS = {
    comme_neuf:    { label: '⭐ Comme neuf',    cls: 'etat-comme_neuf' },
    tres_bon_etat: { label: '✅ Très bon état', cls: 'etat-tres_bon_etat' },
    bon_etat:      { label: '👍 Bon état',      cls: 'etat-bon_etat' },
    mauvais_etat:  { label: '⚠️ Mauvais état',  cls: 'etat-mauvais_etat' },
  };

  let currentItem = null;
  let qty = 1;
  let scanning = true;
  let scanCooldown = false;
  let modalPhotoBase64 = null;

  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const panel  = document.getElementById('panel');

  const empInput = document.getElementById('employee-input');
  empInput.value = localStorage.getItem('kstock_employee') || '';
  empInput.addEventListener('change', () => localStorage.setItem('kstock_employee', empInput.value.trim()));

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      document.getElementById('perm-screen').style.display = 'none';
      requestAnimationFrame(tick);
    } catch { document.querySelector('.perm-sub').textContent = 'Accès refusé. Active la caméra dans les réglages.'; }
  }

  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      if (scanning && !scanCooldown) {
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code) onQRDetected(code.data);
      }
    }
    requestAnimationFrame(tick);
  }

  async function onQRDetected(data) {
    let ref;
    try { ref = new URL(data).searchParams.get('ref'); } catch { ref = data; }
    if (!ref || !ref.startsWith('GOL-')) return;
    if (navigator.vibrate) navigator.vibrate(80);
    scanCooldown = true; scanning = false;
    document.getElementById('loading-article').style.display = 'flex';
    try {
      const item = await API.getGollectItem(ref);
      if (item.error) throw new Error();
      showPanel(item);
    } catch {
      showFlash('Article introuvable', 'error');
      setTimeout(() => { scanCooldown = false; scanning = true; }, 1500);
    } finally {
      document.getElementById('loading-article').style.display = 'none';
    }
  }

  function showPanel(item) {
    currentItem = item;
    qty = 1;
    document.getElementById('qty-display').textContent = '1';

    const etat = ETAT_LABELS[item.etat] || ETAT_LABELS.bon_etat;
    document.getElementById('p-etat-badge').innerHTML = `<span class="etat-badge ${etat.cls}">${etat.label}</span>`;
    document.getElementById('p-name').textContent  = item.nom;
    document.getElementById('p-desc').textContent  = item.description || '';
    document.getElementById('p-stock').textContent = parseInt(item.stock_actuel) || 0;

    // Photos
    const photosRow = document.getElementById('p-photos');
    const addBtn = photosRow.querySelector('.photo-add');
    // Remove old thumbs
    photosRow.querySelectorAll('.photo-thumb').forEach(t => t.remove());
    if (item.photos) {
      item.photos.split(',').filter(Boolean).forEach(url => {
        const img = document.createElement('img');
        img.className = 'photo-thumb';
        img.src = url;
        img.onclick = () => openLightbox(url);
        photosRow.insertBefore(img, addBtn);
      });
    }
    // Update add photo handler
    addBtn.querySelector('input').onchange = function() { uploadPhoto(this); };

    document.getElementById('scan-overlay').style.opacity = '0.3';
    panel.classList.add('open');
  }

  function closePanel() {
    panel.classList.remove('open');
    document.getElementById('scan-overlay').style.opacity = '1';
    currentItem = null;
    setTimeout(() => { scanCooldown = false; scanning = true; }, 800);
  }

  function changeQty(d) {
    qty = Math.max(1, qty + d);
    document.getElementById('qty-display').textContent = qty;
  }

  async function doAction(type) {
    if (!currentItem) return;
    const btns = document.querySelectorAll('.btn-action');
    btns.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
    try {
      const res = await API.gollectMovement(currentItem.ref, type, qty, empInput.value.trim() || 'Anonyme');
      if (res.error) throw new Error();
      document.getElementById('p-stock').textContent = res.stock_actuel;
      showFlash(type === 'sortie' ? `−${qty} enregistré ✓` : `+${qty} enregistré ✓`, 'success');
      setTimeout(() => closePanel(), 900);
    } catch {
      showFlash('Erreur — réessaie', 'error');
      btns.forEach(b => { b.disabled = false; b.style.opacity = '1'; });
    }
  }

  async function uploadPhoto(input) {
    if (!input.files[0] || !currentItem) return;
    showFlash('Upload en cours…', 'success');
    const base64 = await fileToBase64(input.files[0]);
    const resized = await resizeImage(base64, 600);
    try {
      const res = await API.addGollectPhoto(currentItem.ref, resized);
      if (res.error) throw new Error();
      const img = document.createElement('img');
      img.className = 'photo-thumb';
      img.src = res.url;
      img.onclick = () => openLightbox(res.url);
      document.getElementById('p-photos').insertBefore(img, document.querySelector('.photo-add'));
      showFlash('Photo ajoutée ✓', 'success');
    } catch { showFlash('Erreur upload', 'error'); }
  }

  function openLightbox(url) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

  // ── Modal ──
  function openModal()  { document.getElementById('modal-backdrop').classList.add('open'); scanning = false; }
  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    ['m-nom','m-desc','m-stock'].forEach(id => { const el = document.getElementById(id); if(el) el.value = id === 'm-stock' ? '1' : ''; });
    document.getElementById('m-etat').value = 'bon_etat';
    resetPhotoPreview();
    modalPhotoBase64 = null;
    if (!panel.classList.contains('open')) scanning = true;
  }

  function previewPhoto(input) {
    if (!input.files[0]) return;
    fileToBase64(input.files[0]).then(b64 => {
      modalPhotoBase64 = b64;
      const wrap = document.getElementById('photo-preview-wrap');
      wrap.innerHTML = `<img src="${b64}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;" /><input type="file" accept="image/*" capture="environment" style="display:none" id="m-photo-input" onchange="previewPhoto(this)" />`;
    });
  }

  function resetPhotoPreview() {
    document.getElementById('photo-preview-wrap').innerHTML = `
      <div class="photo-placeholder" id="photo-placeholder"><div>📷</div><p>Prendre une photo (optionnel)</p></div>
      <input type="file" accept="image/*" capture="environment" style="display:none" id="m-photo-input" onchange="previewPhoto(this)" />`;
  }

  async function saveItem() {
    const nom   = document.getElementById('m-nom').value.trim();
    const desc  = document.getElementById('m-desc').value.trim();
    const etat  = document.getElementById('m-etat').value;
    const stock = parseInt(document.getElementById('m-stock').value) || 1;
    if (!nom) { showFlash('Le nom est requis', 'error'); return; }

    const ref = 'GOL-' + nom.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]+/g,'').slice(0,10);
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true; btn.textContent = '…';

    try {
      let res = await API.addGollectItem({ ref, nom, description: desc, etat, stock_actuel: stock });
      if (res.error === 'Référence déjà utilisée') {
        let n = 2;
        while (res.error === 'Référence déjà utilisée' && n <= 99) {
          res = await API.addGollectItem({ ref: ref.slice(0,13) + n, nom, description: desc, etat, stock_actuel: stock });
          n++;
        }
      }
      if (res.error) throw new Error(res.error);

      showFlash(`"${nom}" créé ✓`, 'success');
      closeModal();

      // Upload photo en arrière-plan (non-bloquant)
      if (modalPhotoBase64) {
        const resized = await resizeImage(modalPhotoBase64, 400);
        API.addGollectPhoto(ref, resized).catch(() => {});
      }
    } catch (e) {
      showFlash(e.message || 'Erreur', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Créer';
    }
  }

  // ── Helpers ──
  function fileToBase64(file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }

  function resizeImage(base64, maxSize) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.4));
      };
      img.src = base64;
    });
  }

  function showFlash(msg, type) {
    const el = document.getElementById('flash');
    el.textContent = msg; el.className = `flash ${type}`;
    setTimeout(() => el.classList.add('hide'), 1800);
    setTimeout(() => el.className = 'flash', 2200);
  }

  let touchStartY = 0;
  panel.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
  panel.addEventListener('touchend',   e => { if (e.changedTouches[0].clientY - touchStartY > 60) closePanel(); });

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => { video.srcObject = stream; document.getElementById('perm-screen').style.display = 'none'; requestAnimationFrame(tick); })
    .catch(() => {});
</script>
</body>
