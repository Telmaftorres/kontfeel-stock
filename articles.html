<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles — K-Stock</title>
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="index.html">← Scanner</a>
    <div class="nav-links">
      <a class="nav-link active" href="articles.html">Articles</a>
      <a class="nav-link" href="admin.html">Admin</a>
      <a class="nav-link" href="labels.html">Étiquettes</a>
    </div>
  </nav>

  <!-- Modale suppression -->
  <div id="del-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center">
    <div style="background:#fff;border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:480px;text-align:center">
      <p style="font-weight:700;font-size:17px;margin:0 0 6px" id="del-title">Supprimer cet article ?</p>
      <p style="font-size:13px;color:#64748b;margin:0 0 24px" id="del-sub"></p>
      <button id="del-confirm" style="display:block;width:100%;background:#dc2626;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:600;margin-bottom:10px;cursor:pointer">Supprimer</button>
      <button onclick="closeDel()" style="display:block;width:100%;background:none;border:none;color:#64748b;font-size:15px;padding:10px;cursor:pointer">Annuler</button>
    </div>
  </div>

  <div class="container">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" class="search-input" id="search" placeholder="Rechercher un article…" />
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="btn-list" onclick="setView('list')">☰ Liste</button>
      <button class="view-btn" id="btn-grid" onclick="setView('grid')">⊞ Grille</button>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    const ZONES = {
      PALETTE:'Stockage palette', CHUTE:'Chute de matière', CONSO:'Consommables',
      RACK:'Matière racks', RELIQUAT:'Reliquat', 'BOX-LOG':'Box logistique',
      SHOWROOM:'Showroom', BE:'Zone BE', MATERIAU:'Matériautheque',
      FACONNE:'Façonnage', LOGISTIQUE:'Logistique',
    };
    const ZONE_EMOJI = {
      PALETTE:'🪵', CHUTE:'✂️', CONSO:'📦', RACK:'🗄️', RELIQUAT:'🔁',
      'BOX-LOG':'🚚', SHOWROOM:'🖼️', BE:'📐', MATERIAU:'🧪', FACONNE:'⚙️', LOGISTIQUE:'🏭',
    };
    let allArticles = [];
    let currentView = 'list';

    function setView(v) {
      currentView = v;
      document.getElementById('btn-list').classList.toggle('active', v === 'list');
      document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
      render(filtered());
    }

    function filtered() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      return q ? allArticles.filter(a => a.nom.toLowerCase().includes(q) || a.ref.toLowerCase().includes(q)) : allArticles;
    }

    function render(articles) {
      const content = document.getElementById('content');
      if (!articles.length) {
        content.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Aucun article</div></div>';
        return;
      }
      const grouped = {};
      articles.forEach(a => { const z = a.zone || 'AUTRE'; if (!grouped[z]) grouped[z] = []; grouped[z].push(a); });

      if (currentView === 'list') {
        let html = '';
        Object.entries(grouped).forEach(([zone, items]) => {
          html += `<div class="zone-header">${ZONES[zone] || zone}</div>`;
          items.forEach(a => {
            const stock = parseInt(a.stock_actuel) || 0;
            const mini  = parseInt(a.stock_mini) || 0;
            const cls   = stock === 0 ? 'empty' : (mini > 0 && stock <= mini ? 'low' : '');
            html += `<a class="article-item" href="scan.html?ref=${encodeURIComponent(a.ref)}">
              <div>
                <div class="article-name">${a.nom}</div>
                <div class="article-meta">${a.ref} · ${a.unite || 'unité'}</div>
              </div>
              <span class="stock-badge ${cls}">${stock} ${a.unite || ''}</span>
            </a>`;
          });
        });
        content.innerHTML = html;
      } else {
        let html = '<div class="articles-grid">';
        Object.entries(grouped).forEach(([zone, items]) => {
          html += `<div class="grid-zone-header">${ZONES[zone] || zone}</div>`;
          items.forEach(a => {
            const stock   = parseInt(a.stock_actuel) || 0;
            const mini    = parseInt(a.stock_mini) || 0;
            const cls     = stock === 0 ? 'empty' : (mini > 0 && stock <= mini ? 'low' : '');
            const photo   = a.photos ? a.photos.toString().split(',')[0].trim() : '';
            const imgHtml = photo
              ? `<img src="${photo}" alt="" loading="lazy">`
              : `${ZONE_EMOJI[zone] || '📦'}`;
            html += `<a class="grid-card" href="scan.html?ref=${encodeURIComponent(a.ref)}">
              <div class="grid-card-img">
                ${imgHtml}
                <span class="grid-stock-pill ${cls}">${stock}</span>
              </div>
              <div class="grid-card-body">
                <div class="grid-card-name">${a.nom}</div>
                <div class="grid-card-meta">${a.ref}</div>
              </div>
            </a>`;
          });
        });
        html += '</div>';
        content.innerHTML = html;
      }
    }

    async function load() {
      try { allArticles = await API.listArticles(); render(filtered()); }
      catch { document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Erreur de chargement</div></div>'; }
    }

    // ── Long-press pour supprimer ──────────────────────────────
    let lpTimer = null;
    let lpArticle = null;

    function attachLongPress(el, article) {
      el.addEventListener('touchstart', e => {
        lpTimer = setTimeout(() => { e.preventDefault(); showDel(article); }, 600);
      }, { passive: false });
      el.addEventListener('touchend',  () => clearTimeout(lpTimer));
      el.addEventListener('touchmove', () => clearTimeout(lpTimer));
    }

    function showDel(article) {
      lpArticle = article;
      document.getElementById('del-sub').textContent = `${article.nom} (${article.ref})`;
      const modal = document.getElementById('del-modal');
      modal.style.display = 'flex';
    }

    function closeDel() {
      document.getElementById('del-modal').style.display = 'none';
      lpArticle = null;
    }

    document.getElementById('del-confirm').addEventListener('click', async () => {
      if (!lpArticle) return;
      const ref = lpArticle.ref;
      closeDel();
      try {
        await API.deleteArticle(ref);
        allArticles = allArticles.filter(a => a.ref !== ref);
        render(filtered());
      } catch (e) {
        alert('Erreur : ' + e.message);
      }
    });

    const _origRender = render;
    render = function(articles) {
      _origRender(articles);
      document.querySelectorAll('.article-item, .grid-card').forEach(el => {
        const ref = el.href && new URL(el.href).searchParams.get('ref');
        const a = ref && allArticles.find(x => x.ref === ref);
        if (a) attachLongPress(el, a);
      });
    };

    document.getElementById('search').addEventListener('input', () => render(filtered()));

    load();
  </script>
</body>
</html>
