<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Étiquettes — K-Stock</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .articles-list { max-width: 640px; margin: 0 auto; padding: 0 16px 100px; }
    .article-row {
      display: flex; align-items: center; gap: 12px;
      background: white; border: 1px solid var(--slate-200);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 6px;
      transition: border-color 0.15s;
    }
    .article-row.selected { border-color: #4f46e5; background: #eef2ff; }
    .article-row input[type=checkbox] { width: 20px; height: 20px; accent-color: #4f46e5; cursor: pointer; flex-shrink: 0; }
    .article-row-info { flex: 1; min-width: 0; }
    .article-row-name { font-size: 14px; font-weight: 600; color: var(--slate-900); }
    .article-row-meta { font-size: 12px; color: var(--slate-400); margin-top: 1px; }
    .qty-input {
      width: 56px; height: 36px;
      border: 1px solid var(--slate-200); border-radius: 8px;
      text-align: center; font-size: 15px; font-weight: 600;
      color: var(--slate-900); background: white; outline: none;
    }
    .qty-input:focus { border-color: #4f46e5; }
    .sticky-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; border-top: 1px solid var(--slate-200);
      padding: 12px 16px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .selected-count { font-size: 14px; color: var(--slate-500); }
    .selected-count strong { color: var(--slate-900); }

    .dim-panel {
      background: white; border: 1px solid var(--slate-200);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
      max-width: 640px; margin-left: auto; margin-right: auto;
    }
    .dim-panel-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
    .dim-panel-title { font-size: 13px; font-weight: 600; color: var(--slate-700); }
    .dim-panel-body { margin-top: 12px; display: none; }
    .dim-panel-body.open { display: block; }
    .dim-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .dim-field label { font-size: 12px; color: var(--slate-500); display: block; margin-bottom: 3px; }
    .dim-field input {
      width: 100%; height: 36px;
      border: 1px solid var(--slate-200); border-radius: 8px;
      padding: 0 10px; font-size: 14px; outline: none; background: white;
    }
    .dim-field input:focus { border-color: #4f46e5; }

    #print-area { display: none; }

    /* ── IMPRESSION ── */
    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; box-sizing: border-box; }
      @page { size: A4 portrait; margin: 0; }
      html, body { margin: 0; padding: 0; background: white; }
      .no-print { display: none !important; }
      #print-area { display: block !important; }

      .print-page {
        width: 210mm;
        height: 297mm;
        overflow: hidden;
        page-break-after: always;
      }

      /* Grille sans aucun gap parasite */
      .print-row {
        display: flex;
        width: 100%;
      }

      .plabel {
        display: flex;
        align-items: center;
        overflow: hidden;
        border: 0.4mm solid #bbb;
        flex-shrink: 0;
      }

      .plabel img {
        flex-shrink: 0;
        display: block;
      }

      .plabel-text {
        flex: 1;
        min-width: 0;
        padding: 0 2mm;
        overflow: hidden;
      }

      .plabel-zone {
        font-size: 6pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #4f46e5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .plabel-name {
        font-size: 8pt;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.25;
        margin-top: 0.8mm;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .plabel-ref {
        font-size: 6pt;
        color: #64748b;
        font-family: monospace;
        margin-top: 0.8mm;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .plabel-empty { border: none !important; }
    }
  </style>
</head>
<body>

<nav class="nav no-print">
  <a class="nav-logo" href="index.html">📦 K-Stock</a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Scanner</a>
    <a class="nav-link" href="articles.html">Articles</a>
    <a class="nav-link active" href="labels.html">Étiquettes</a>
  </div>
</nav>

<div class="no-print" style="max-width:640px;margin:0 auto;padding:16px 16px 4px;">
  <h2 style="font-size:16px;font-weight:700;margin-bottom:4px;">Étiquettes à imprimer</h2>
  <p style="font-size:13px;color:var(--slate-400);margin-bottom:12px;">Coche les articles, règle la quantité, puis imprime.</p>

  <!-- Dimensions -->
  <div class="dim-panel">
    <div class="dim-panel-header" onclick="toggleDim()">
      <span class="dim-panel-title">⚙️ Format — <span id="dim-summary">105 × 35 mm · 2 col × 8 lignes</span></span>
      <span id="dim-arrow" style="font-size:12px;color:var(--slate-400);">▼</span>
    </div>
    <div class="dim-panel-body" id="dim-body">
      <div class="dim-grid">
        <div class="dim-field"><label>Largeur étiquette (mm)</label><input type="number" id="d-w" value="105" step="0.1" oninput="updateDimSummary()" /></div>
        <div class="dim-field"><label>Hauteur étiquette (mm)</label><input type="number" id="d-h" value="35" step="0.1" oninput="updateDimSummary()" /></div>
        <div class="dim-field"><label>Colonnes</label><input type="number" id="d-cols" value="2" min="1" max="10" oninput="updateDimSummary()" /></div>
        <div class="dim-field"><label>Lignes</label><input type="number" id="d-rows" value="8" min="1" max="20" oninput="updateDimSummary()" /></div>
        <div class="dim-field"><label>Espace entre étiquettes (mm)</label><input type="number" id="d-gap" value="1" step="0.5" /></div>
        <div class="dim-field"><label>Marge haut (mm)</label><input type="number" id="d-mt" value="0" step="0.5" /></div>
        <div class="dim-field"><label>Marge gauche (mm)</label><input type="number" id="d-ml" value="0" step="0.5" /></div>
      </div>
    </div>
  </div>

  <!-- Recherche + actions -->
  <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
    <div class="search-wrap" style="flex:1;min-width:180px;margin-bottom:0;">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" class="search-input" id="search" placeholder="Rechercher un article…" oninput="filterList()" />
    </div>
    <button class="btn btn-outline btn-sm" onclick="selectAll()">Tout sélectionner</button>
    <button class="btn btn-outline btn-sm" onclick="selectNone()">Tout décocher</button>
  </div>
</div>

<div class="articles-list no-print" id="articles-list">
  <div class="spinner"></div>
</div>

<div id="print-area"></div>

<div class="sticky-bar no-print">
  <div class="selected-count" id="selected-count">Aucun article sélectionné</div>
  <button class="btn btn-primary" onclick="doPrint()">🖨️ Imprimer</button>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  const ZONES = {
    PALETTE:'Stockage palette', CHUTE:'Chute de matière', CONSO:'Consommables',
    RACK:'Matière racks', RELIQUAT:'Reliquat', 'BOX-LOG':'Box logistique',
    SHOWROOM:'Showroom', BE:'Zone BE', MATERIAU:'Matériautheque',
    FACONNE:'Façonnage', LOGISTIQUE:'Logistique',
  };

  let articles = [];

  function getDims() {
    return {
      w:    parseFloat(document.getElementById('d-w').value)  || 105,
      h:    parseFloat(document.getElementById('d-h').value)  || 35,
      cols: parseInt(document.getElementById('d-cols').value) || 2,
      rows: parseInt(document.getElementById('d-rows').value) || 8,
      gap:  parseFloat(document.getElementById('d-gap').value) || 0,
      mt:   parseFloat(document.getElementById('d-mt').value) || 0,
      ml:   parseFloat(document.getElementById('d-ml').value) || 0,
    };
  }

  function toggleDim() {
    document.getElementById('dim-body').classList.toggle('open');
    document.getElementById('dim-arrow').textContent =
      document.getElementById('dim-body').classList.contains('open') ? '▲' : '▼';
  }

  function updateDimSummary() {
    const d = getDims();
    document.getElementById('dim-summary').textContent =
      `${d.w} × ${d.h} mm · ${d.cols} col × ${d.rows} lignes`;
  }

  function qrUrl(ref, sizePx) {
    const appUrl = 'https://kontfeel-stock.vercel.app/scan.html?ref=' + encodeURIComponent(ref);
    return `https://api.qrserver.com/v1/create-qr-code/?size=${sizePx}x${sizePx}&margin=2&data=${encodeURIComponent(appUrl)}`;
  }

  function updateCount() {
    const n = document.querySelectorAll('.art-check:checked').length;
    document.getElementById('selected-count').innerHTML =
      n === 0 ? 'Aucun article sélectionné'
      : `<strong>${n}</strong> article${n>1?'s':''} sélectionné${n>1?'s':''}`;
  }

  function filterList() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    document.querySelectorAll('.article-row').forEach(row => {
      const text = row.querySelector('.article-row-name').textContent.toLowerCase()
        + row.querySelector('.article-row-meta').textContent.toLowerCase();
      row.style.display = !q || text.includes(q) ? '' : 'none';
    });
  }

  function selectAll() {
    document.querySelectorAll('.art-check:not([style*="none"])').forEach(c => {
      if (c.closest('.article-row').style.display !== 'none') {
        c.checked = true; c.closest('.article-row').classList.add('selected');
      }
    });
    updateCount();
  }

  function selectNone() {
    document.querySelectorAll('.art-check').forEach(c => {
      c.checked = false; c.closest('.article-row').classList.remove('selected');
    });
    updateCount();
  }

  function doPrint() {
    const selected = [];
    document.querySelectorAll('.art-check:checked').forEach(c => {
      const ref = c.dataset.ref;
      const qty = parseInt(document.getElementById('qty-' + ref).value) || 1;
      const art = articles.find(a => a.ref === ref);
      if (art) for (let i = 0; i < qty; i++) selected.push(art);
    });
    if (!selected.length) { alert('Sélectionne au moins un article.'); return; }

    const d = getDims();
    // QR code : hauteur étiquette - 4mm de padding, converti en px (96dpi → 1mm ≈ 3.78px)
    const qrMm  = Math.round(d.h - 4);
    const qrPx  = Math.round(qrMm * 3.78);

    const perPage = d.cols * d.rows;
    const pages   = [];
    for (let i = 0; i < selected.length; i += perPage) pages.push(selected.slice(i, i + perPage));

    const area = document.getElementById('print-area');
    area.innerHTML = pages.map(page => {
      let rowsHtml = '';
      for (let r = 0; r < d.rows; r++) {
        let cells = '';
        for (let c = 0; c < d.cols; c++) {
          const art = page[r * d.cols + c];
          const marginRight = c < d.cols - 1 ? `margin-right:${d.gap}mm;` : '';
          if (art) {
            cells += `<div class="plabel" style="width:${d.w}mm;height:${d.h}mm;padding:2mm 0 2mm 2mm;${marginRight}">
              <img src="${qrUrl(art.ref, qrPx)}" style="width:${qrMm}mm;height:${qrMm}mm;" />
              <div class="plabel-text">
                <div class="plabel-zone">${ZONES[art.zone]||art.zone||''}</div>
                <div class="plabel-name">${art.nom}</div>
                <div class="plabel-ref">${art.ref}</div>
              </div>
            </div>`;
          } else {
            cells += `<div class="plabel plabel-empty" style="width:${d.w}mm;height:${d.h}mm;${marginRight}"></div>`;
          }
        }
        const marginBottom = r < d.rows - 1 ? `margin-bottom:${d.gap}mm;` : '';
        rowsHtml += `<div class="print-row" style="${marginBottom}">${cells}</div>`;
      }
      return `<div class="print-page" style="padding-top:${d.mt}mm;padding-left:${d.ml}mm;">${rowsHtml}</div>`;
    }).join('');

    setTimeout(() => window.print(), 400);
  }

  async function load() {
    const list = document.getElementById('articles-list');
    try {
      articles = await API.listArticles();
      if (!articles.length) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Aucun article.</div></div>';
        return;
      }
      list.innerHTML = articles.map(a => `
        <div class="article-row">
          <input type="checkbox" class="art-check" data-ref="${a.ref}"
            onchange="this.closest('.article-row').classList.toggle('selected',this.checked);updateCount()" />
          <div class="article-row-info">
            <div class="article-row-name">${a.nom}</div>
            <div class="article-row-meta">${ZONES[a.zone]||a.zone||''} · ${a.ref}</div>
          </div>
          <input type="number" class="qty-input" id="qty-${a.ref}" value="1" min="1" max="50" />
        </div>`).join('');
    } catch {
      list.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Erreur de chargement</div></div>';
    }
  }

  load();
</script>
</body>
</html>
