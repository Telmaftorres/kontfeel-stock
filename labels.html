<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Étiquettes — K-Stock</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Écran ── */
    .articles-list { max-width: 640px; margin: 0 auto; padding: 0 16px 100px; }
    .article-row {
      display: flex; align-items: center; gap: 12px;
      background: white; border: 1px solid var(--slate-200);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .article-row.selected { border-color: #4f46e5; background: #eef2ff; }
    .article-row input[type=checkbox] { width: 20px; height: 20px; accent-color: #4f46e5; cursor: pointer; flex-shrink: 0; }
    .article-row-info { flex: 1; min-width: 0; }
    .article-row-name { font-size: 14px; font-weight: 600; color: var(--slate-900); }
    .article-row-meta { font-size: 12px; color: var(--slate-400); margin-top: 1px; }
    .qty-input {
      width: 56px; height: 36px;
      border: 1px solid var(--slate-200); border-radius: 8px;
      text-align: center; font-size: 15px; font-weight: 600;
      color: var(--slate-900); background: white; outline: none;
    }
    .qty-input:focus { border-color: #4f46e5; }
    .sticky-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; border-top: 1px solid var(--slate-200);
      padding: 12px 16px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .selected-count { font-size: 14px; color: var(--slate-500); }
    .selected-count strong { color: var(--slate-900); }

    /* ── Panneau dimensions ── */
    .dim-panel {
      background: white; border: 1px solid var(--slate-200);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
      max-width: 640px; margin-left: auto; margin-right: auto;
    }
    .dim-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .dim-panel-title { font-size: 13px; font-weight: 600; color: var(--slate-700); }
    .dim-panel-body { margin-top: 12px; display: none; }
    .dim-panel-body.open { display: block; }
    .dim-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .dim-field label { font-size: 12px; color: var(--slate-500); display: block; margin-bottom: 3px; }
    .dim-field input {
      width: 100%; height: 36px;
      border: 1px solid var(--slate-200); border-radius: 8px;
      padding: 0 10px; font-size: 14px; outline: none; background: white;
    }
    .dim-field input:focus { border-color: #4f46e5; }

    /* ── Zone impression ── */
    #print-area { display: none; }

    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @page { size: A4; margin: 0; }
      .no-print { display: none !important; }
      body { margin: 0; background: white; }
      #print-area { display: block !important; }

      .print-page {
        width: 210mm;
        height: 297mm;
        padding: var(--page-margin-top) var(--page-margin-left);
        box-sizing: border-box;
        page-break-after: always;
      }

      .print-row {
        display: flex;
        gap: var(--gap-h);
        margin-bottom: var(--gap-v);
      }

      .plabel {
        width: var(--label-w);
        height: var(--label-h);
        box-sizing: border-box;
        border: 0.3mm solid #ccc;
        border-radius: 1.5mm;
        padding: 1.5mm;
        display: flex;
        align-items: center;
        gap: 1.5mm;
        overflow: hidden;
        flex-shrink: 0;
      }

      .plabel img {
        width: var(--qr-size);
        height: var(--qr-size);
        flex-shrink: 0;
      }

      .plabel-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }

      .plabel-zone {
        font-size: 5pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #4f46e5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .plabel-name {
        font-size: 6.5pt;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.2;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        margin-top: 0.5mm;
      }

      .plabel-ref {
        font-size: 5pt;
        color: #94a3b8;
        font-family: monospace;
        margin-top: 0.5mm;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body>

<nav class="nav no-print">
  <a class="nav-logo" href="index.html">📦 K-Stock</a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Scanner</a>
    <a class="nav-link" href="articles.html">Articles</a>
    <a class="nav-link active" href="labels.html">Étiquettes</a>
  </div>
</nav>

<div class="no-print" style="max-width:640px;margin:0 auto;padding:16px 16px 4px;">
  <h2 style="font-size:16px;font-weight:700;margin-bottom:4px;">Étiquettes à imprimer</h2>
  <p style="font-size:13px;color:var(--slate-400);margin-bottom:12px;">Coche les articles, règle la quantité, puis imprime.</p>

  <!-- Panneau dimensions -->
  <div class="dim-panel">
    <div class="dim-panel-header" onclick="toggleDim()">
      <span class="dim-panel-title">⚙️ Format étiquettes — <span id="dim-summary">48.5 × 25.4 mm · 4 col × 10 lignes</span></span>
      <span id="dim-arrow" style="font-size:12px;color:var(--slate-400);">▼</span>
    </div>
    <div class="dim-panel-body" id="dim-body">
      <div class="dim-grid">
        <div class="dim-field"><label>Largeur étiquette (mm)</label><input type="number" id="d-w" value="48.5" step="0.1" oninput="updateDimSummary()" /></div>
        <div class="dim-field"><label>Hauteur étiquette (mm)</label><input type="number" id="d-h" value="25.4" step="0.1" oninput="updateDimSummary()" /></div>
        <div class="dim-field"><label>Nombre de colonnes</label><input type="number" id="d-cols" value="4" min="1" max="10" oninput="updateDimSummary()" /></div>
        <div class="dim-field"><label>Nombre de lignes</label><input type="number" id="d-rows" value="10" min="1" max="20" oninput="updateDimSummary()" /></div>
        <div class="dim-field"><label>Marge haut page (mm)</label><input type="number" id="d-mt" value="10" step="0.5" /></div>
        <div class="dim-field"><label>Marge gauche page (mm)</label><input type="number" id="d-ml" value="5" step="0.5" /></div>
        <div class="dim-field"><label>Espacement horizontal (mm)</label><input type="number" id="d-gh" value="0" step="0.5" /></div>
        <div class="dim-field"><label>Espacement vertical (mm)</label><input type="number" id="d-gv" value="0" step="0.5" /></div>
      </div>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:8px;">
    <button class="btn btn-outline btn-sm" onclick="selectAll()">Tout sélectionner</button>
    <button class="btn btn-outline btn-sm" onclick="selectNone()">Tout décocher</button>
  </div>
</div>

<div class="articles-list no-print" id="articles-list">
  <div class="spinner"></div>
</div>

<!-- Zone impression -->
<div id="print-area"></div>

<div class="sticky-bar no-print">
  <div class="selected-count" id="selected-count">Aucun article sélectionné</div>
  <button class="btn btn-primary" onclick="doPrint()">🖨️ Imprimer</button>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  const ZONES = {
    PALETTE:'Stockage palette', CHUTE:'Chute de matière', CONSO:'Consommables',
    RACK:'Matière racks', RELIQUAT:'Reliquat', 'BOX-LOG':'Box logistique',
    SHOWROOM:'Showroom', BE:'Zone BE', MATERIAU:'Matériautheque',
    FACONNE:'Façonnage', LOGISTIQUE:'Logistique',
  };

  let articles = [];

  function getDims() {
    return {
      w:    parseFloat(document.getElementById('d-w').value)    || 48.5,
      h:    parseFloat(document.getElementById('d-h').value)    || 25.4,
      cols: parseInt(document.getElementById('d-cols').value)   || 4,
      rows: parseInt(document.getElementById('d-rows').value)   || 10,
      mt:   parseFloat(document.getElementById('d-mt').value)   || 10,
      ml:   parseFloat(document.getElementById('d-ml').value)   || 5,
      gh:   parseFloat(document.getElementById('d-gh').value)   || 0,
      gv:   parseFloat(document.getElementById('d-gv').value)   || 0,
    };
  }

  function toggleDim() {
    const body = document.getElementById('dim-body');
    const arrow = document.getElementById('dim-arrow');
    body.classList.toggle('open');
    arrow.textContent = body.classList.contains('open') ? '▲' : '▼';
  }

  function updateDimSummary() {
    const d = getDims();
    document.getElementById('dim-summary').textContent =
      `${d.w} × ${d.h} mm · ${d.cols} col × ${d.rows} lignes`;
  }

  function qrUrl(ref) {
    const appUrl = 'https://kontfeel-stock.vercel.app/scan.html?ref=' + encodeURIComponent(ref);
    return `https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=2&data=${encodeURIComponent(appUrl)}`;
  }

  function updateCount() {
    const n = document.querySelectorAll('.art-check:checked').length;
    document.getElementById('selected-count').innerHTML =
      n === 0 ? 'Aucun article sélectionné'
      : `<strong>${n}</strong> article${n>1?'s':''} sélectionné${n>1?'s':''}`;
  }

  function selectAll()  { document.querySelectorAll('.art-check').forEach(c => { c.checked = true;  c.closest('.article-row').classList.add('selected'); }); updateCount(); }
  function selectNone() { document.querySelectorAll('.art-check').forEach(c => { c.checked = false; c.closest('.article-row').classList.remove('selected'); }); updateCount(); }

  function doPrint() {
    const selected = [];
    document.querySelectorAll('.art-check:checked').forEach(c => {
      const ref = c.dataset.ref;
      const qty = parseInt(document.getElementById('qty-' + ref).value) || 1;
      const art = articles.find(a => a.ref === ref);
      if (art) for (let i = 0; i < qty; i++) selected.push(art);
    });

    if (!selected.length) { alert('Sélectionne au moins un article.'); return; }

    const d = getDims();
    const qrSizeMm = Math.min(d.h - 3, 18);

    // Injecter les CSS variables
    const style = document.createElement('style');
    style.id = 'print-vars';
    style.textContent = `:root {
      --label-w: ${d.w}mm;
      --label-h: ${d.h}mm;
      --page-margin-top: ${d.mt}mm;
      --page-margin-left: ${d.ml}mm;
      --gap-h: ${d.gh}mm;
      --gap-v: ${d.gv}mm;
      --qr-size: ${qrSizeMm}mm;
    }`;
    document.getElementById('print-vars')?.remove();
    document.head.appendChild(style);

    // Construire les pages
    const perPage = d.cols * d.rows;
    const pages = [];
    for (let i = 0; i < selected.length; i += perPage) {
      pages.push(selected.slice(i, i + perPage));
    }

    const area = document.getElementById('print-area');
    area.innerHTML = pages.map(page => {
      const rows = [];
      for (let r = 0; r < d.rows; r++) {
        const rowLabels = [];
        for (let c = 0; c < d.cols; c++) {
          const art = page[r * d.cols + c];
          if (art) {
            rowLabels.push(`
              <div class="plabel">
                <img src="${qrUrl(art.ref)}" />
                <div class="plabel-text">
                  <div class="plabel-zone">${ZONES[art.zone]||art.zone||''}</div>
                  <div class="plabel-name">${art.nom}</div>
                  <div class="plabel-ref">${art.ref}</div>
                </div>
              </div>`);
          } else {
            rowLabels.push(`<div class="plabel" style="border:none;"></div>`);
          }
        }
        rows.push(`<div class="print-row">${rowLabels.join('')}</div>`);
      }
      return `<div class="print-page">${rows.join('')}</div>`;
    }).join('');

    setTimeout(() => window.print(), 300);
  }

  async function load() {
    const list = document.getElementById('articles-list');
    try {
      articles = await API.listArticles();
      if (!articles.length) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Aucun article.</div></div>';
        return;
      }
      list.innerHTML = articles.map(a => `
        <div class="article-row">
          <input type="checkbox" class="art-check" data-ref="${a.ref}"
            onchange="this.closest('.article-row').classList.toggle('selected',this.checked);updateCount()" />
          <div class="article-row-info">
            <div class="article-row-name">${a.nom}</div>
            <div class="article-row-meta">${ZONES[a.zone]||a.zone||''} · ${a.ref}</div>
          </div>
          <input type="number" class="qty-input" id="qty-${a.ref}" value="1" min="1" max="50" title="Nb d'exemplaires" />
        </div>`).join('');
    } catch {
      list.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Erreur de chargement</div></div>';
    }
  }

  load();
</script>
</body>
</html>
